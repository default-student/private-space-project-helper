name: Build and release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK as a GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Missing Actions secret ANDROID_SIGNING_KEYSTORE_BASE64' >&2; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}
        # Keep CI releases above the locally installed development build (100008).
        run: VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER)) ./build-local.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-space-project-helper-apk
          path: artifacts/private-space-project-helper.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: artifacts/private-space-project-helper.apk
          RELEASE_TAG: ${{ github.event_name == 'push' && format('v0.1.{0}', github.run_number) || format('manual-{0}', github.run_number) }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" --title "Private Space Projects $RELEASE_TAG" --generate-notes
          fi
